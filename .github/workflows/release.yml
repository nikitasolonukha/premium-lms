name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    name: Build verified release artifact
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Require a version tag on reviewed main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build immutable labeled image
        env:
          TAG: ${{ github.ref_name }}
        run: docker build --build-arg VERSION="$TAG" --build-arg COMMIT_SHA="$GITHUB_SHA" -t "premium-lms:$TAG" -t "premium-lms:$GITHUB_SHA" .
      - name: Verify container runtime
        env:
          QA_IMAGE: premium-lms:${{ github.ref_name }}
        run: node scripts/test-docker.mjs
      - name: Package and checksum Docker artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker save "premium-lms:$TAG" "premium-lms:$GITHUB_SHA" | gzip -n > premium-lms-image.tar.gz
          sha256sum premium-lms-image.tar.gz > SHA256SUMS
          printf 'Commit: %s\nImage: premium-lms:%s\n\nCode release artifact; deployment status is documented in docs/RELEASE_READINESS.md. This release does not deploy infrastructure.\n' "$GITHUB_SHA" "$TAG" > release-notes.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" premium-lms-image.tar.gz SHA256SUMS --verify-tag --title "Premium LMS $TAG" --notes-file release-notes.txt
